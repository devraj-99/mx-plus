name: Build MX Plus APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MXPLUS_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build release APK
        env:
          MXPLUS_VERSION_CODE: ${{ github.run_number }}
          MXPLUS_STORE_FILE: release.jks
          MXPLUS_STORE_PASSWORD: ${{ secrets.MXPLUS_STORE_PASSWORD }}
          MXPLUS_KEY_ALIAS: ${{ secrets.MXPLUS_KEY_ALIAS }}
          MXPLUS_KEY_PASSWORD: ${{ secrets.MXPLUS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon --console=plain

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          mkdir -p out
          cp "$APK" "out/MX-Plus-v${VERSION}-${{ github.run_number }}.apk"
          gh release create "v${VERSION}-test-${{ github.run_number }}" "out/MX-Plus-v${VERSION}-${{ github.run_number }}.apk" \
            --title "MX Plus v${VERSION} build ${{ github.run_number }}" \
            --notes "Test build. Signed with the MX Plus key. Version code goes up every build so it installs over the last one." \
            --prerelease
